name: Update Composer Lock (one-off)

# Workflow sementara untuk meregenerasi backend/composer.lock di runner yang
# punya PHP + composer. Dijalankan manual, lalu dihapus sebelum PR merge.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lock:
    name: composer update laravel/framework
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Update laravel/framework
        run: composer update laravel/framework --with-dependencies --no-interaction --no-scripts --prefer-dist

      - name: Show updated versions
        run: |
          composer show laravel/framework | head -5
          composer audit --locked

      - name: Commit and push lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if git diff --cached --quiet; then
            echo "No lockfile changes"
          else
            git commit -m "chore(deps): patch laravel/framework for CVE-2026-128083"
            git push origin HEAD:${{ github.ref_name }}
          fi
